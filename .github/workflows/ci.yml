name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # addendum §2: off = the owner role (as every clone runs today); enforce = app_rw, NOBYPASSRLS. RLS is opt-in (D-23;
        # owner decision 2026-11-05): a clone runs the enforce leg once it sets the repo variable RLS_ENFORCE=1. The template always runs both.
        rls: ${{ fromJSON((github.repository == 'shanelabountyai/saas-foundation' || vars.RLS_ENFORCE == '1') && '["off","enforce"]' || '["off"]') }}
    env:
      # Ephemeral runner-local Postgres, gone when the job ends.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/footnote_test?connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/footnote_test?connection_limit=10&pool_timeout=20
      AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789abc
      APP_URL: http://localhost:5800
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: America/Chicago # a non-UTC server zone, like the laptop's, so the db timezone test can go red here
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pinned corpus (non-negotiable 5): a changed byte in corpus/text or corpus/private fails here. Python stdlib only.
      - run: npm run corpus:check
      - run: npm run lint
      - run: npm run typecheck
      - run: createdb footnote_test
      - run: npx prisma migrate deploy
      - name: RLS enforce leg — app role, system URL
        if: matrix.rls == 'enforce'
        run: |
          db=${DATABASE_URL%%\?*}; db=${db##*/} # the job's own test DB name, so a clone's rename needs no edit here (F-14)
          psql -d "$db" -c "CREATE ROLE app_rw LOGIN PASSWORD 'app_rw' NOBYPASSRLS NOSUPERUSER;"
          psql -d "$db" -c "GRANT USAGE ON SCHEMA public TO app_rw; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_rw; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_rw;"
          echo "RLS_MODE=enforce" >> "$GITHUB_ENV"
          echo "DATABASE_URL_SYSTEM=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://app_rw:app_rw@localhost:5432/$db?connection_limit=8&pool_timeout=20" >> "$GITHUB_ENV"
      - run: npx vitest run
      # Non-negotiable 3 (D-12b): fts index on the runner's database, then PT-1/2/3 + the chunk-table lint. No Voyage key
      # in CI, so dense/hybrid run locally; their predicate is linted here and their filter is in the integration tests.
      - run: npm run corpus:index -- --retriever=fts
      - run: npm run permissions:verify -- --retriever=fts
      # Production build, served — the way it ships. login.spec.ts drives a real page.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # Spec §4 / §13.3: both modules deleted by the manifest, and the tree must still generate, typecheck, build and pass drift.
  modules-removed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run foundation:check-modules
